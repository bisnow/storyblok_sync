name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Test on the Node pinned in .nvmrc (24 — the same runtime the action ships
      # on, per action.yml). Its built-in undici major must match the pinned
      # `undici` devDependency (^7 → Node 24): src/http.test.ts drives the real
      # SDK through undici's MockAgent, which only intercepts the global fetch
      # when the two undici majors match — a mismatch escapes to the network as
      # ENOTFOUND. Keeping the version in .nvmrc keeps CI, local dev, and the
      # action runtime on one Node.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build bundle
        run: npm run build
      - name: Verify dist/ is up to date
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "::error::dist/ is out of date. Run 'npm run build' and commit the result."
            git --no-pager diff --stat dist/
            exit 1
          fi

  # Keep the moving major tag (e.g. v1) pointed at the latest green main commit,
  # so consumers pinned to @v1 always resolve to the newest passing build — no
  # GitHub Release required. Gated on `verify`, so v1 only ever moves to a commit
  # whose committed dist/ bundle is proven current. The major is read from
  # package.json: a future bump to 2.x moves v2 and freezes v1 at its last commit.
  #
  # Requires the TAG_PUSH_TOKEN secret (an identity on the org tag-ruleset bypass
  # list); the org "Tag Create" ruleset blocks refs/tags/v* for the default
  # GITHUB_TOKEN. checkout persists this token so the later `git push` uses it.
  tag:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # If a newer main push arrives, cancel this move so v1 never lands on an
    # older commit than the newest green one.
    concurrency:
      group: move-major-tag
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.TAG_PUSH_TOKEN }}
      - name: Move major tag to this commit
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version package.json)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::package.json version '$VERSION' is not semver."
            exit 1
          fi
          MAJOR="v${VERSION%%.*}"                 # 1.0.0 -> v1
          echo "Moving $MAJOR -> ${GITHUB_SHA:0:7} (package.json version $VERSION)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/$MAJOR"
